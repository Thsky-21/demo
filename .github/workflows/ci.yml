# CI for the PUBLIC MIRROR repo (Thsky-21/demo), not for this one.
#
# GitHub only reads workflows from `.github/workflows` at the ROOT of a repo, so
# this file is inert where it sits — the monorepo's own CI is the root
# `.github/workflows/ci.yml` and that is the one that runs here. Living at
# packages/demo/.github/ means the mirror's CI is a version-controlled source
# file, reviewed in the same diff as the code it tests, rather than something
# scripts/mirror-demo.ts generates at push time. A generated workflow is a
# workflow nobody reads.
#
# scripts/mirror-demo.ts copies this to `.github/workflows/ci.yml` in the
# mirror. It is the ONE file the mirror moves rather than copies in place;
# every other path is identical on both sides.
#
# Deliberately has no publish step. Publishing requires 2FA/OTP and is a
# decision, not a merge side effect.
#
# NO PORT/PARITY TESTS HERE, and that is not an oversight. engine.ts's parity
# with the Lua and pricing.ts's parity with the production registry are both
# comparisons against code that only exists in the control-plane repo — see
# CONTRIBUTING.md. Copying those tests here would compare this package
# against a stale copy of its other half. What this package CAN prove alone —
# that it still typechecks, builds, and actually runs standalone — this proves.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      # The job that matters: it proves the package still compiles with
      # nothing around it. In the monorepo it can accidentally lean on the
      # root node_modules or ../../lib; here it cannot, which is the whole
      # point of this repo existing.
      - name: Build
        run: npm run build

      # Actually run the built CLI end to end — no signup, no API key, no
      # network, so there is no reason this can't run in CI. If the standalone
      # build silently broke the demo a stranger runs, this is where it shows.
      - name: Run the demo end to end
        run: |
          output="$(NO_COLOR=1 node dist/cli.js)"
          echo "$output"
          echo "$output" | grep -q "KILLED" || {
            echo "Expected the demo to reach a KILLED verdict — it didn't."
            exit 1
          }

      # Prints exactly what would go in the published tarball, so a `files`
      # mistake — a missing LICENSE, an accidentally shipped source tree —
      # shows up in the log instead of in a stranger's npx cache.
      - name: Show what would be published
        run: npm pack --dry-run
